apiVersion: 1
groups:
  - orgId: 1
    name: fbm
    folder: FBM
    interval: 1m
    rules:
      - uid: fbm-overdue
        title: Orders overdue for shipping
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels: { severity: high }
        annotations:
          summary: "{{ $values.B }} order(s) past the ship deadline"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: fbm_orders_overdue, instant: true, refId: A }
          - refId: B
            datasourceUid: __expr__
            model: { type: reduce, reducer: last, expression: A, refId: B }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: C }

      - uid: fbm-stale-run
        title: Pipeline has not run in 6h
        condition: C
        for: 10m
        noDataState: Alerting
        labels: { severity: high }
        annotations: { summary: "run_all.sh has not completed in 6h" }
        data:
          - refId: A
            datasourceUid: prometheus
            model: { expr: "(time() - fbm_last_run_timestamp) / 3600, instant: true, refId: A" }
          - refId: B
            datasourceUid: __expr__
            model: { type: reduce, reducer: last, expression: A, refId: B }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [6] } }], refId: C }

      - uid: fbm-order-spike
        title: Order spike needing action
        condition: C
        for: 15m
        labels: { severity: medium }
        annotations: { summary: "{{ $values.B }} new orders queued" }
        data:
          - refId: A
            datasourceUid: prometheus
            model: { expr: fbm_orders_new, instant: true, refId: A }
          - refId: B
            datasourceUid: __expr__
            model: { type: reduce, reducer: last, expression: A, refId: B }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [5] } }], refId: C }

      - uid: fbm-no-listings
        title: Listings dropped to zero
        condition: C
        for: 30m
        labels: { severity: high }
        annotations: { summary: "no active listings - possible suspension" }
        data:
          - refId: A
            datasourceUid: prometheus
            model: { expr: fbm_listings_active, instant: true, refId: A }
          - refId: B
            datasourceUid: __expr__
            model: { type: reduce, reducer: last, expression: A, refId: B }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [1] } }], refId: C }
