repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: module-smoke
        name: import every module
        entry: python -c "import fbm_core, tracking, accounts, suppliers, reprice, groups, crosslist, crosslist_post, inbox_poller, inbox_ai, insights, returns, tax, dashboard, deadman, metrics, fbm_validate, targets_builder, copy_generator, samples, session_guard"
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: no-secrets
        name: .env must be 600
        entry: bash -c '[ -f .env ] && chmod 600 .env || true'
        language: system
        pass_filenames: false
        stages: [pre-commit]