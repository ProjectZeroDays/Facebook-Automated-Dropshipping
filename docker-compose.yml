services:
  worker:
    build: .
    command: ["worker"]
    env_file: [.env]
    volumes:
      - ./data:/app/data
      - ./inventory.csv:/app/inventory.csv
      - ./skus.csv:/app/skus.csv
      - ./groups.txt:/app/groups.txt
      - ./suppliers.json:/app/suppliers.json
    restart: unless-stopped
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import fbm_core; print('ok')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard:
    build: .
    command: ["dashboard"]
    env_file: [.env]
    volumes:
      - ./data:/app/data
    ports: ["8080:8080"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    ports: ["3000:3000"]
    restart: unless-stopped
    depends_on:
      - prometheus