{% extends "wizard/_layout.html" %}
{% block title %}Choose your city{% endblock %}
{% block content %}
<h1>Pick your metro</h1>
<p class="sub">Local demand, price bands and competition are pulled per city.</p>
<form method="post" action="/wizard/city" class="mt-3">
  <div class="field"><label class="lbl">City</label>
    <input class="inp" name="city" value="{{ city or 'Memphis, TN' }}" required></div>
  <div class="field mt-2"><label class="lbl">State</label>
    <input class="inp" name="state" value="{{ state or 'TN' }}" required></div>
  <div class="row mt-3">
    <button class="btn btn--primary" type="submit">Continue</button>
  </div>
</form>
{% endblock %}
