{% extends "wizard/_layout.html" %}
{% block title %}Import products{% endblock %}
{% block content %}
<h1>Import products</h1>
<p class="sub">Upload a CSV or let the engine pick 20 winning SKUs for your city.</p>
<form method="post" action="/wizard/products" enctype="multipart/form-data" class="mt-3">
  <div class="field"><label class="lbl">CSV file</label><input class="inp" type="file" name="csv" accept=".csv"></div>
  <div class="mt-3">{{ dropzone('photos') }}</div>
  <div class="row mt-3">
    <button class="btn btn--primary" type="submit">Import</button>
    <button class="btn btn--secondary" type="submit" name="auto" value="1">Auto-pick 20</button>
  </div>
</form>
{% endblock %}
