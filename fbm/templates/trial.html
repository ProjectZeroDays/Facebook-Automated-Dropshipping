<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Start Trial — FBM Ops</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
:root{--bg:#0b0d12;--panel:#12141a;--fg:#ecf0f7;--muted:#8892a8;--border:#262c3a;--accent:#6366f1;--bad:#ef4444;--r:14px;--sh-2:0 10px 30px rgba(0,0,0,.5);}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(160deg,#0b0d12 0%,#11131a 100%);color:var(--fg);font:16px/1.6 Inter,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:linear-gradient(180deg,#161a21,#12142a);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:36px;max-width:480px;width:100%;box-shadow:var(--sh-2)}
h1{font-size:28px;font-weight:800;margin:0 0 8px;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:15px;margin-bottom:24px}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:14px 28px;border-radius:10px;font-weight:700;text-decoration:none;font-size:15px;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(99,102,241,.35);transition:filter .2s}
.btn:hover{filter:brightness(1.15)}
.note{color:var(--muted);font-size:12px;margin-top:12px}
</style></head>
<body>
<div class="card">
  <h1>15-Day Trial</h1>
  <div class="sub">Start your autonomous dropshipping operations. No payment required for 15 days.</div>
  <form method="post" action="/trial">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn">Start Trial — 15 Days Free</button>
  </form>
  <div class="note">Restricted use only — see LICENSE. Trial requires admin setup.</div>
</div>
</body>
</html>
