[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fbm-ops"
version = "0.2.0"
description = "Autonomous Facebook Marketplace dropshipping operations"
requires-python = ">=3.11"
dependencies = ["playwright==1.47.0","flask==3.0.3","gunicorn==22.0.0",
                "requests==2.32.3","pillow==10.4.0","pyotp==2.9.0","prometheus-client==0.20.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.2","pytest-cov==5.0.0","ruff==0.6.9","pre-commit==3.8.0"]

[project.scripts]
fbm-bot     = "fbm.bot:main"
fbm-scrape  = "fbm.scraper:main"
fbm-watch   = "fbm.watcher:main"
fbm-dash    = "fbm.dashboard:app"
fbm-boot    = "fbm.bootstrap:main"

[tool.setuptools]
packages = ["fbm"]
include-package-data = true

[tool.setuptools.package-data]
fbm = ["templates/*.html", "static/*", "data/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"